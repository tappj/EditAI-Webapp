name: Desktop QA
on:
  workflow_dispatch:
  push:
    branches: [codex/desktop-migration]
    paths:
      [
        "desktop/**",
        "lib/**",
        "app/**",
        "components/**",
        "scripts/build-desktop.mjs",
        "package*.json",
        ".github/workflows/desktop-qa.yml",
      ]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      DO_NOT_TRACK: "1"
      PUBLIK_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run typecheck
      - run: npm test
      - run: npm run desktop:build
      - run: npm run test:desktop
      # Internal QA bundles only. No unsigned installer is uploaded or published.
      - if: runner.os == 'Windows'
        run: npx electron-builder --config desktop/electron-builder.qa.yml --win nsis --x64 --publish never
      - if: runner.os == 'macOS'
        run: npx electron-builder --config desktop/electron-builder.qa.yml --mac dmg --publish never
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/release -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer not built' }
          $destination = Join-Path $env:LOCALAPPDATA 'Programs/EditAI-QA'
          $install = Start-Process $installer.FullName -ArgumentList '/S',"/D=$destination" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'QA installer failed' }
          if (-not (Test-Path "$destination/EditAI.exe")) { throw 'Installed executable missing' }
          $env:PUBLIK_SELF_TEST = '1'
          $result = & "$destination/EditAI.exe" 2>&1 | Out-String
          if ($result -notmatch 'publik self-test: ok editai-desktop 0.2.8') { throw 'Packaged Publik self-test failed' }
          Write-Output 'Packaged Publik self-test passed. Windows interactive editing/install is not yet certified.'
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:EDITAI_EXECUTABLE = Join-Path $env:LOCALAPPDATA 'Programs/EditAI-QA/EditAI.exe'
          node desktop/test-gate.mjs
      - if: runner.os == 'macOS'
        shell: bash
        run: |
          bundle=$(printf '%s\n' desktop/release/mac*/EditAI.app | head -1)
          codesign --verify --deep --strict "$bundle"
          image=$(printf '%s\n' desktop/release/*.dmg | head -1)
          hdiutil attach "$image" -readonly -nobrowse -mountpoint /tmp/editai-dmg-qa
          codesign --verify --deep --strict /tmp/editai-dmg-qa/EditAI.app
          hdiutil detach /tmp/editai-dmg-qa
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
